name: Prüfung

# Bei jedem Pull Request (und bei jedem Push auf den Arbeitsbranch): Versionshinweise müssen zusammenpassen,
# index.html muss aktuell sein, die Versionsnummer darf noch nicht veröffentlicht sein, und die Sicherheits-Tests
# (CSP, nginx-Header, Live-Test des Containers) müssen bestehen.
# Die Actions sind auf feste Commit-Prüfsummen gesetzt (Schutz gegen veränderte Versions-Tags).
on:
  pull_request:
  push:
    branches: [naechste-version]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Versionshinweise und Build prüfen
        run: node scripts/check-release.mjs
      - name: Sicherheits-Tests (CSP, Links, nginx.conf, docker-compose.yml)
        run: node scripts/test-sicherheit.mjs
      - name: Live-Test der Auslieferung (nginx-Container angreifen)
        run: sh scripts/test-nginx.sh
      - name: Version muss neu sein
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node scripts/check-release.mjs --version)
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Version v$VERSION ist schon veröffentlicht. Bitte die Version erhöhen und neue Versionshinweise in CHANGELOG.md und auf der Webseite ergänzen."
            exit 1
          fi
          echo "Version v$VERSION ist neu."
