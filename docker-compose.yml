# S.D.L.W. ausrollen, z. B. mit der Git-Synchronisierung von Arcane.
# Arcane holt den Ordner, in dem diese Datei liegt (das ganze Repository), und startet diesen Stack.
# nginx liefert nur die Dateien der Webseite aus (siehe nginx.conf), nicht den Rest des Repositorys.
services:
  website:
    image: nginx:stable-alpine
    container_name: meine-website
    restart: unless-stopped
    # Härtung: keine zusätzlichen Rechte, Dateisystem schreibgeschützt (nginx schreibt nur in die tmpfs-Ordner),
    # nur die Linux-Rechte, die nginx zum Starten braucht. Geprüft von scripts/test-nginx.sh in GitHub Actions.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    ports:
      - "${PORT:-8080}:80"
    volumes:
      # Das Repository selbst, nur lesend. Ein Ordner (keine einzelnen Dateien), damit Updates sofort ankommen.
      - ./:/srv/site:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
