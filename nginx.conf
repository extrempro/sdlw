# nginx für S.D.L.W. (wird von docker-compose.yml eingebunden)
#
# Ausgeliefert werden nur die Dateien der Webseite:
#   /  bzw. /index.html, /manifest.webmanifest, /sw.js, /icons/…
# Alles andere im Repository (src/, scripts/, CHANGELOG.md, docker-compose.yml, …) gibt 404.
#
# Seite, Manifest und Service Worker werden nicht zwischengespeichert („no-cache“ = vor jeder Nutzung beim Server
# nachfragen). So bekommen Browser und die installierte App ein Update gleich nach dem nächsten git-Sync.
# HTTPS (nötig für die App) macht ein Reverse-Proxy davor, nicht dieser Container.

server {
    listen 80;
    server_name _;

    root /srv/site;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Für den Docker-Healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Startseite
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Service Worker: immer frisch, sonst kommen Updates verspätet an
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # App-Manifest (falls die eingebaute MIME-Liste .webmanifest nicht kennt)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # App-Symbole ändern sich selten
    location /icons/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Alles andere aus dem Repository nicht ausliefern
    location / {
        return 404;
    }
}
