# nginx für S.D.L.W. (wird von docker-compose.yml eingebunden, liegt dort im http-Block)
#
# Ausgeliefert werden nur die Dateien der Webseite:
#   /  bzw. /index.html, /manifest.webmanifest, /sw.js, /icons/…
# Alles andere im Repository (src/, scripts/, .git/, CHANGELOG.md, docker-compose.yml, …) gibt 404.
# Erlaubt sind nur GET und HEAD.
#
# Seite, Manifest und Service Worker werden nicht zwischengespeichert („no-cache“ = vor jeder Nutzung beim Server
# nachfragen). So bekommen Browser und die installierte App ein Update gleich nach dem nächsten git-Sync.
# HTTPS (nötig für die App) macht der Reverse-Proxy davor (NetBird), nicht dieser Container.
#
# Sicherheits-Header stehen nur hier im server-Block. Achtung: Ein add_header in einem location-Block würde
# ALLE Header von hier oben aufheben – deshalb gibt es in den location-Blöcken kein add_header.
# Die Content-Security-Policy für Skripte steht als <meta> in index.html (erzeugt von scripts/build.mjs);
# hier kommen die Teile dazu, die nur als Header gehen (frame-ancestors).
# Geprüft wird das alles von scripts/test-nginx.sh (läuft in GitHub Actions mit dem echten Container).

map $uri $sdlw_cache {
    default    "no-cache";
    ~^/icons/  "public, max-age=86400";
}

server {
    listen 80;
    server_name _;

    root /srv/site;
    charset utf-8;
    server_tokens off;
    autoindex off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Cache-Control $sdlw_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Für den Docker-Healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Startseite
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
    }

    # Service Worker: immer frisch, sonst kommen Updates verspätet an
    location = /sw.js {
    }

    # App-Manifest (falls die eingebaute MIME-Liste .webmanifest nicht kennt)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # App-Symbole ändern sich selten (Cache-Control über die map oben)
    location /icons/ {
    }

    # Alles andere aus dem Repository nicht ausliefern
    location / {
        return 404;
    }
}
